<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12263A">
  <title>Daily Routine</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="update" role="status" hidden>
    <span>A new version is ready.</span>
    <button id="updateBtn">Update</button>
  </div>

  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button id="gear" aria-label="Settings">⚙</button>
  </header>

  <section id="view-today" class="view"></section>
  <section id="view-routine" class="view" hidden></section>
  <section id="view-progress" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page"><span aria-hidden="true">☀</span>Today</button>
  <button data-tab="routine"><span aria-hidden="true">☰</span>Routine</button>
  <button data-tab="progress"><span aria-hidden="true">▮</span>Progress</button>
</nav>

<dialog id="settings">
  <h3>Reminders</h3>
  <p class="sub" id="pushStatus"></p>
  <div class="row">
    <button id="pushToggle" class="primary">Turn on reminders</button>
    <button id="test">Send test</button>
    <button id="reset">Clear today's ticks</button>
    <button id="close">Close</button>
  </div>
</dialog>

<dialog id="editor"></dialog>

<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
